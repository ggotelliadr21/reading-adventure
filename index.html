<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reading Adventure - Grade 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', -apple-system, sans-serif;
    background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
    min-height: 100vh;
    color: #333;
    padding: 12px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  h1 { color: #FF6B6B; text-align: center; font-size: 36px; margin-bottom: 4px; text-shadow: 2px 2px 0 #FFF; }
  .subtitle { color: #4ECDC4; text-align: center; margin-bottom: 16px; font-size: 20px; font-weight: bold; }
  .card {
    background: white; border-radius: 24px; padding: 22px; margin-bottom: 16px;
    box-shadow: 0 8px 0 #FFD93D, 0 12px 25px rgba(0,0,0,0.15); border: 4px solid #FFD93D;
  }
  .start-btn {
    display: block; width: 100%; background: linear-gradient(135deg, #FF6B6B, #FF8E53);
    color: white; border: none; padding: 20px; font-size: 24px; border-radius: 20px;
    margin: 12px 0; cursor: pointer; font-weight: bold; box-shadow: 0 6px 0 #E55A5A;
  }
  .passage {
    background: #FFF9E6; border-left: 6px solid #FF6B6B; padding: 16px; margin: 16px 0;
    font-size: 22px; line-height: 1.6; border-radius: 12px; border: 3px solid #FFE5B4;
  }
  .question { font-size: 24px; font-weight: bold; margin: 18px 0 12px; }
  .option {
    display: flex; align-items: center; background: #F0F8FF; border: 3px solid #87CEEB;
    border-radius: 16px; padding: 16px 18px; margin: 12px 0; font-size: 20px; cursor: pointer;
  }
  .option.correct { background: #C8E6C9; border-color: #4CAF50; }
  .option.wrong { background: #FFCDD2; border-color: #F44336; }
  .letter {
    background: #4ECDC4; color: white; width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 14px; font-size: 22px;
  }
  .option.correct .letter { background: #4CAF50; }
  .option.wrong .letter { background: #F44336; }
  .btn { background: #4ECDC4; color: white; border: none; padding: 14px 24px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 8px; }
  .btn-secondary { background: #FF6B6B; }
  .controls { text-align: center; margin-top: 18px; }
  .score-box { text-align: center; font-size: 22px; margin: 16px 0; line-height: 1.6; }
  .hidden { display: none; }
  .progress { font-size: 18px; color: #FF6B6B; text-align: center; margin-bottom: 6px; font-weight: bold; }
  .stars { text-align: center; font-size: 28px; margin: 8px 0; }
  .feedback { text-align: center; font-size: 22px; font-weight: bold; margin: 10px 0; min-height: 30px; }
  .mascot { text-align: center; font-size: 48px; margin-bottom: 8px; }
  .listen-btn { background: #FFD93D; color: #333; border: none; padding: 10px 18px; border-radius: 50px; font-size: 18px; font-weight: bold; margin: 8px 0; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <div class="mascot">🌟📖🚀</div>
  <h1>Reading Adventure!</h1>
  <p class="subtitle">Grade 2 Power Practice</p>

  <div id="home" class="card">
    <div class="mascot">🦁</div>
    <p style="text-align:center; margin-bottom:16px; font-size:20px; font-weight:bold;">Ready for a reading adventure?</p>
    <button class="start-btn" onclick="startAdaptive()">Start Adventure! 🚀</button>
    <p style="text-align:center; font-size:15px; color:#666; margin-top:8px;" id="historyNote">Progress is saved on this iPad.</p>
  </div>

  <div id="practice" class="card hidden">
    <div class="stars" id="starDisplay">⭐⭐⭐⭐⭐</div>
    <div class="progress" id="progressText"></div>
    <div id="questionArea"></div>
    <div class="feedback" id="feedbackText"></div>
    <div class="controls">
      <button class="btn btn-secondary" onclick="showHome()">Home</button>
    </div>
  </div>

  <div id="results" class="card hidden">
    <div class="mascot" id="resultMascot">🎉</div>
    <div class="score-box" id="resultsText"></div>
    <div class="controls">
      <button class="btn" onclick="startAdaptive()">Play Again! 🚀</button>
      <button class="btn btn-secondary" onclick="showHome()">Home</button>
    </div>
  </div>
</div>

<script>
const allQuestions = [
  // vocab
  { type: "vocab", sentence: "The puppy was so ___ that he fell asleep.", options: ["sleepy", "loud", "green", "wet"], answer: 0 },
  { type: "vocab", sentence: "She used a ___ to cut the paper.", options: ["scissors", "spoon", "ball", "hat"], answer: 0 },
  { type: "vocab", sentence: "The sun is very ___ in the sky.", options: ["dark", "cold", "wet", "bright"], answer: 3 },
  { type: "vocab", sentence: "Please ___ your hands before you eat.", options: ["color", "hide", "wash", "break"], answer: 2 },
  { type: "vocab", sentence: "The birds ___ south for the winter.", options: ["fly", "swim", "run", "jump"], answer: 0 },
  { type: "vocab", sentence: "Please ___ the door when you leave.", options: ["close", "open", "paint", "break"], answer: 0 },
  { type: "vocab", sentence: "She was ___ when her team won the game.", options: ["excited", "bored", "sleepy", "hungry"], answer: 0 },
  { type: "vocab", sentence: "The scientist made an important ___ about the plant.", options: ["discovery", "mistake", "noise", "game"], answer: 0 },
  { type: "vocab", sentence: "The little bird can ___ high in the sky.", options: ["swim", "fly", "dig", "sleep"], answer: 1 },
  { type: "vocab", sentence: "We need a ___ to drink the water.", options: ["cup", "book", "shoe", "hat"], answer: 0 },

  // phonics
  { type: "phonics", question: "Which word has the same ending sound as dog?", options: ["cat", "log", "hat", "sun"], answer: 1 },
  { type: "phonics", question: "Which word is made of two syllables?", options: ["cat", "happy", "dog", "run"], answer: 1 },
  { type: "phonics", question: "Which word rhymes with cat?", options: ["hat", "dog", "sun", "big"], answer: 0 },
  { type: "phonics", question: "Which word has the short a sound?", options: ["cake", "rain", "play", "cat"], answer: 3 },
  { type: "phonics", question: "Which word has the same vowel sound as rain?", options: ["ran", "play", "rug", "pin"], answer: 1 },
  { type: "phonics", question: "What does re- mean in the word redo?", options: ["not", "before", "again", "under"], answer: 2 },
  { type: "phonics", question: "What does the prefix un- mean in unhappy?", options: ["again", "before", "under", "not"], answer: 3 },
  { type: "phonics", question: "Which word has a long a sound?", options: ["cat", "cake", "cut", "cup"], answer: 1 },
  { type: "phonics", question: "What is the base word in jumping?", options: ["jump", "ing", "jumper", "jumped"], answer: 0 },
  { type: "phonics", question: "Which word is a compound word?", options: ["happy", "sunflower", "jump", "run"], answer: 1 },

  // passage
  { type: "passage", passage: "Jen planted a seed. She gave it water. A green sprout came up.", question: "What happened after Jen gave the seed water?", options: ["She found a cup.", "A green sprout came up.", "She ate the seed.", "The cup broke."], answer: 1 },
  { type: "passage", passage: "Tom got a new bike. He rode it to the park.", question: "Where did Tom ride his bike?", options: ["To school", "To the park", "To the store", "Home"], answer: 1 },
  { type: "passage", passage: "Max the rabbit ran fast at the start. He got tired and stopped. Sam the turtle kept going slowly and won.", question: "Why did Sam win the race?", options: ["He was faster.", "He never stopped.", "Max let him win.", "He ran the wrong way."], answer: 1 },
  { type: "passage", passage: "Bees collect nectar from flowers. They take it to the hive and turn it into honey.", question: "What do bees turn nectar into?", options: ["Wax", "Honey", "Pollen", "Leaves"], answer: 1 },
  { type: "passage", passage: "Mia held a red balloon. A strong wind blew and the balloon flew away.", question: "What color was the balloon?", options: ["Blue", "Red", "Yellow", "Green"], answer: 1 },
  { type: "passage", passage: "The little boat rocked on the waves. The sailor pulled the rope so the sail would catch the wind. Soon the boat moved faster.", question: "Why did the boat move faster?", options: ["The sailor jumped out.", "The sail caught the wind.", "The waves stopped.", "The rope broke."], answer: 1 },
  { type: "passage", passage: "Dogs need food and water every day. They also need walks and love.", question: "What do dogs need every day?", options: ["Toys only", "Food and water", "A car", "Books"], answer: 1 },
  { type: "passage", passage: "Fish live in water. They use fins to swim and gills to breathe.", question: "What do fish use to breathe?", options: ["Fins", "Gills", "Tails", "Eyes"], answer: 1 },

  // audio (listen then answer)
  { type: "audio", audioText: "The cat sat on the mat.", question: "Where did the cat sit?", options: ["In the tree", "Under the bed", "On the chair", "On the mat"], answer: 3 },
  { type: "audio", audioText: "Sam has a red ball.", question: "What color is the ball?", options: ["Blue", "Green", "Red", "Yellow"], answer: 2 },
  { type: "audio", audioText: "The bird flew high in the sky.", question: "Where did the bird fly?", options: ["High in the sky", "In the water", "Under the ground", "In a tree"], answer: 0 },
  { type: "audio", audioText: "The little dog ran after the ball and barked happily.", question: "What did the dog do?", options: ["He slept", "He barked happily", "He swam", "He ate"], answer: 1 },
  { type: "audio", audioText: "Mia put on her blue coat and went outside.", question: "What color was Mia’s coat?", options: ["Red", "Blue", "Green", "Yellow"], answer: 1 },
  { type: "audio", audioText: "The big yellow bus stopped at the corner.", question: "What color was the bus?", options: ["Red", "Blue", "Yellow", "Green"], answer: 2 }
];

let history = JSON.parse(localStorage.getItem('readingHistory') || '{}');
let currentIndex = 0;
const totalQuestions = 12;
let score = 0;
let stars = 0;
let sessionUsed = new Set();
let currentQuestion = null;

function getWeakness(type) {
  const h = history[type] || { correct: 0, total: 0 };
  if (h.total < 2) return 0.6;
  return 1 - (h.correct / h.total);
}

function pickQuestion() {
  const types = ['vocab', 'phonics', 'passage', 'audio'];
  const weights = types.map(t => ({ type: t, w: getWeakness(t) + 0.25 }));
  const totalW = weights.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * totalW;
  let chosen = 'vocab';
  for (const w of weights) {
    r -= w.w;
    if (r <= 0) { chosen = w.type; break; }
  }

  let available = allQuestions.filter(q => q.type === chosen && !sessionUsed.has(JSON.stringify(q)));
  if (available.length === 0) {
    available = allQuestions.filter(q => !sessionUsed.has(JSON.stringify(q)));
  }
  if (available.length === 0) available = allQuestions;
  const q = available[Math.floor(Math.random() * available.length)];
  sessionUsed.add(JSON.stringify(q));
  return q;
}

function startAdaptive() {
  currentIndex = 0;
  score = 0;
  stars = 0;
  sessionUsed = new Set();
  document.getElementById('home').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('practice').classList.remove('hidden');
  updateStars();
  showNextItem();
}

function updateStars() {
  document.getElementById('starDisplay').textContent = '⭐'.repeat(Math.min(stars, 5)) + '☆'.repeat(Math.max(0, 5 - stars));
}

function speak(text) {
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }
}

function showNextItem() {
  if (currentIndex >= totalQuestions) {
    showResults();
    return;
  }
  document.getElementById('feedbackText').textContent = '';
  currentQuestion = pickQuestion();
  document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${totalQuestions}`;

  const area = document.getElementById('questionArea');
  let html = '';
  if (currentQuestion.type === 'audio') {
    html += `<button class="listen-btn" onclick="speak('${currentQuestion.audioText.replace(/'/g, "\\'")}')">🔊 Listen</button>`;
    html += `<div class="question">${currentQuestion.question}</div>`;
  } else if (currentQuestion.passage) {
    html += `<div class="passage">${currentQuestion.passage}</div>`;
    html += `<div class="question">${currentQuestion.question}</div>`;
  } else if (currentQuestion.sentence) {
    html += `<div class="question">${currentQuestion.sentence.replace('___', '<span style="border-bottom:3px solid #FF6B6B;padding:0 8px;font-weight:bold;color:#FF6B6B;">______</span>')}</div>`;
  } else {
    html += `<div class="question">${currentQuestion.question}</div>`;
  }
  const letters = ['A', 'B', 'C', 'D'];
  html += '<div class="options">';
  currentQuestion.options.forEach((opt, i) => {
    html += `<div class="option" onclick="selectAnswer(${i})"><div class="letter">${letters[i]}</div><div>${opt}</div></div>`;
  });
  html += '</div>';
  area.innerHTML = html;
}

function selectAnswer(chosen) {
  const correct = currentQuestion.answer;
  const options = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedbackText');
  options.forEach((opt, idx) => {
    opt.style.pointerEvents = 'none';
    if (idx === correct) opt.classList.add('correct');
    if (idx === chosen && chosen !== correct) opt.classList.add('wrong');
  });

  const type = currentQuestion.type;
  if (!history[type]) history[type] = { correct: 0, total: 0 };
  history[type].total++;
  if (chosen === correct) {
    score++;
    stars = Math.min(stars + 1, 5);
    history[type].correct++;
    feedback.textContent = "Awesome! 🎉";
    feedback.style.color = "#4CAF50";
  } else {
    feedback.textContent = "Good try! Keep going 💪";
    feedback.style.color = "#FF6B6B";
  }
  localStorage.setItem('readingHistory', JSON.stringify(history));
  updateStars();
  currentIndex++;
  setTimeout(showNextItem, 1100);
}

function showResults() {
  document.getElementById('practice').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  const percent = Math.round((score / totalQuestions) * 100);
  let summary = `You got <strong>${score}</strong> out of <strong>${totalQuestions}</strong>!<br>`;
  summary += `<span style="font-size:28px;">${percent >= 80 ? '🏆 Super Reader!' : percent >= 60 ? '⭐ Great Job!' : '🌟 Keep Going!'}</span><br><br>`;
  summary += "Progress saved. Next time it will focus more on the harder areas.<br>";
  document.getElementById('resultsText').innerHTML = summary;
  document.getElementById('resultMascot').textContent = percent >= 80 ? '🏆' : percent >= 60 ? '🎉' : '💪';
}

function showHome() {
  document.getElementById('practice').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}
</script>
</body>
</html>

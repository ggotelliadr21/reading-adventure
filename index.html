<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reading Adventure - Grade 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', -apple-system, sans-serif;
    background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
    min-height: 100vh;
    color: #333;
    padding: 12px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  h1 { color: #FF6B6B; text-align: center; font-size: 36px; margin-bottom: 4px; text-shadow: 2px 2px 0 #FFF; }
  .subtitle { color: #4ECDC4; text-align: center; margin-bottom: 16px; font-size: 20px; font-weight: bold; }
  .card {
    background: white;
    border-radius: 24px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 8px 0 #FFD93D, 0 12px 25px rgba(0,0,0,0.15);
    border: 4px solid #FFD93D;
  }
  .start-btn {
    display: block; width: 100%; background: linear-gradient(135deg, #FF6B6B, #FF8E53);
    color: white; border: none; padding: 20px; font-size: 24px; border-radius: 20px;
    margin: 12px 0; cursor: pointer; font-weight: bold; box-shadow: 0 6px 0 #E55A5A;
  }
  .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #E55A5A; }
  .passage {
    background: #FFF9E6; border-left: 6px solid #FF6B6B; padding: 16px; margin: 16px 0;
    font-size: 22px; line-height: 1.6; border-radius: 12px; border: 3px solid #FFE5B4;
  }
  .question { font-size: 24px; font-weight: bold; margin: 18px 0 12px; color: #333; }
  .option {
    display: flex; align-items: center; background: #F0F8FF; border: 3px solid #87CEEB;
    border-radius: 16px; padding: 16px 18px; margin: 12px 0; font-size: 20px; cursor: pointer;
  }
  .option:active { transform: scale(0.98); }
  .option.correct { background: #C8E6C9; border-color: #4CAF50; }
  .option.wrong { background: #FFCDD2; border-color: #F44336; }
  .letter {
    background: #4ECDC4; color: white; width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 14px;
    font-size: 22px; flex-shrink: 0;
  }
  .option.correct .letter { background: #4CAF50; }
  .option.wrong .letter { background: #F44336; }
  .btn {
    background: #4ECDC4; color: white; border: none; padding: 14px 24px; font-size: 18px;
    border-radius: 50px; cursor: pointer; font-weight: bold; margin: 8px; box-shadow: 0 4px 0 #3DB8B0;
  }
  .btn-secondary { background: #FF6B6B; box-shadow: 0 4px 0 #E55A5A; }
  .controls { text-align: center; margin-top: 18px; }
  .score-box { text-align: center; font-size: 22px; margin: 16px 0; line-height: 1.6; }
  .hidden { display: none; }
  .progress { font-size: 18px; color: #FF6B6B; text-align: center; margin-bottom: 6px; font-weight: bold; }
  .stars { text-align: center; font-size: 28px; margin: 8px 0; }
  .diff-label { text-align: center; font-size: 16px; color: #4ECDC4; font-weight: bold; margin-bottom: 10px; }
  .blank { border-bottom: 3px solid #FF6B6B; padding: 0 8px; font-weight: bold; color: #FF6B6B; }
  .feedback { text-align: center; font-size: 22px; font-weight: bold; margin: 10px 0; min-height: 30px; }
  .mascot { text-align: center; font-size: 48px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="mascot">🌟📖🚀</div>
  <h1>Reading Adventure!</h1>
  <p class="subtitle">Grade 2 Power Practice</p>

  <div id="home" class="card">
    <div class="mascot">🦁</div>
    <p style="text-align:center; margin-bottom:16px; font-size:20px; font-weight:bold;">Ready for a reading adventure?</p>
    <button class="start-btn" onclick="startAdaptive()">Start Adventure! 🚀</button>
    <p style="text-align:center; font-size:16px; color:#666; margin-top:12px;">No repeats — every question is new until the pool is used up.</p>
  </div>

  <div id="practice" class="card hidden">
    <div class="stars" id="starDisplay">⭐⭐⭐⭐⭐</div>
    <div class="progress" id="progressText"></div>
    <div class="diff-label" id="diffLabel"></div>
    <div id="questionArea"></div>
    <div class="feedback" id="feedbackText"></div>
    <div class="controls">
      <button class="btn btn-secondary" onclick="showHome()">Home</button>
    </div>
  </div>

  <div id="results" class="card hidden">
    <div class="mascot" id="resultMascot">🎉</div>
    <div class="score-box" id="resultsText"></div>
    <div class="controls">
      <button class="btn" onclick="startAdaptive()">Play Again! 🚀</button>
      <button class="btn btn-secondary" onclick="showHome()">Home</button>
    </div>
  </div>
</div>

<script>
// Larger pools so 15 questions almost never need to repeat
const easyItems = [
  { sentence: "The puppy was so ___ that he fell asleep.", options: ["sleepy", "loud", "green", "wet"], answer: 0 },
  { question: "Which word has the same ending sound as dog?", options: ["cat", "log", "hat", "sun"], answer: 1 },
  { passage: "Jen planted a seed. She gave it water. A green sprout came up.", question: "What happened after Jen gave the seed water?", options: ["She found a cup.", "A green sprout came up.", "She ate the seed.", "The cup broke."], answer: 1 },
  { sentence: "She used a ___ to cut the paper.", options: ["scissors", "spoon", "ball", "hat"], answer: 0 },
  { question: "Which word is made of two syllables?", options: ["cat", "happy", "dog", "run"], answer: 1 },
  { sentence: "The sun is very ___ in the sky.", options: ["dark", "cold", "wet", "bright"], answer: 3 },
  { question: "Which word rhymes with cat?", options: ["hat", "dog", "sun", "big"], answer: 0 },
  { passage: "Tom got a new bike. He rode it to the park.", question: "Where did Tom ride his bike?", options: ["To school", "To the park", "To the store", "Home"], answer: 1 },
  { sentence: "Please ___ your hands before you eat.", options: ["color", "hide", "wash", "break"], answer: 2 },
  { question: "Which word has the short a sound?", options: ["cake", "rain", "play", "cat"], answer: 3 },
  { passage: "Dogs need food and water every day.", question: "What do dogs need every day?", options: ["Toys only", "Food and water", "A car", "Books"], answer: 1 },
  { sentence: "The bird can ___ high in the sky.", options: ["swim", "fly", "dig", "sleep"], answer: 1 }
];

const mediumItems = [
  { sentence: "The birds ___ south for the winter.", options: ["fly", "swim", "run", "jump"], answer: 0 },
  { question: "Which word has the same vowel sound as rain?", options: ["ran", "play", "rug", "pin"], answer: 1 },
  { passage: "Max the rabbit ran fast at the start. He got tired and stopped. Sam the turtle kept going slowly and won.", question: "Why did Sam win the race?", options: ["He was faster.", "He never stopped.", "Max let him win.", "He ran the wrong way."], answer: 1 },
  { sentence: "Please ___ the door when you leave.", options: ["close", "open", "paint", "break"], answer: 0 },
  { question: "What does re- mean in the word redo?", options: ["not", "before", "again", "under"], answer: 2 },
  { passage: "Bees collect nectar from flowers. They take it to the hive and turn it into honey.", question: "What do bees turn nectar into?", options: ["Wax", "Honey", "Pollen", "Leaves"], answer: 1 },
  { sentence: "The little ant worked hard all summer.", question: "What is the theme?", options: ["Hard work helps later.", "Ants are mean.", "Summer is long.", "Playing is best."], answer: 0 },
  { question: "What does the prefix un- mean in unhappy?", options: ["again", "before", "under", "not"], answer: 3 },
  { passage: "Mia held a red balloon. A strong wind blew and the balloon flew away.", question: "What color was the balloon?", options: ["Blue", "Red", "Yellow", "Green"], answer: 1 },
  { sentence: "She was ___ when her team won the game.", options: ["excited", "bored", "sleepy", "hungry"], answer: 0 },
  { question: "Which word has a long a sound?", options: ["cat", "cake", "cut", "cup"], answer: 1 },
  { passage: "The little boat rocked on the waves. The sailor pulled the rope so the sail would catch the wind.", question: "Why did the boat move faster?", options: ["The sailor jumped out.", "The sail caught the wind.", "The waves stopped.", "The rope broke."], answer: 1 }
];

const hardItems = [
  { sentence: "The scientist made an important ___ about the plant.", options: ["discovery", "mistake", "noise", "game"], answer: 0 },
  { question: "What is the base word in jumping?", options: ["jump", "ing", "jumper", "jumped"], answer: 0 },
  { passage: "The little boat rocked on the waves. The sailor pulled the rope tightly so the sail would catch the wind. Soon the boat moved faster across the water.", question: "Why did the boat move faster?", options: ["The sailor jumped out.", "The sail caught the wind.", "The waves stopped.", "The rope broke."], answer: 1 },
  { sentence: "She was ___ when her team won the game.", options: ["excited", "bored", "sleepy", "hungry"], answer: 0 },
  { question: "Which word has the same vowel sound as boat?", options: ["boat", "bat", "bit", "but"], answer: 0 },
  { passage: "Fish live in water. They use fins to swim and gills to breathe.", question: "What do fish use to breathe?", options: ["Fins", "Gills", "Tails", "Eyes"], answer: 1 },
  { sentence: "The explorer found a hidden ___ in the forest.", options: ["cave", "car", "cake", "cup"], answer: 0 },
  { question: "What does the suffix -er mean in teacher?", options: ["again", "not", "person who", "under"], answer: 2 },
  { passage: "The ant worked hard all summer while the grasshopper played. When winter came the ant had food.", question: "What is the main idea?", options: ["Hard work pays off.", "Grasshoppers are fun.", "Winter is cold.", "Ants are small."], answer: 0 },
  { sentence: "Please ___ the instructions carefully.", options: ["read", "eat", "run", "sleep"], answer: 0 },
  { question: "Which word is a compound word?", options: ["happy", "sunflower", "jump", "run"], answer: 1 },
  { passage: "Bees collect nectar from flowers and turn it into honey in the hive.", question: "Where do bees make honey?", options: ["In the garden", "In the hive", "In the tree", "In the water"], answer: 1 }
];

let currentDifficulty = 2;
let currentIndex = 0;
const totalQuestions = 15;
let score = 0;
let correctByLevel = {1: 0, 2: 0, 3: 0};
let askedByLevel = {1: 0, 2: 0, 3: 0};
let usedEasy = new Set();
let usedMedium = new Set();
let usedHard = new Set();
let stars = 0;
let sessionUsed = new Set(); // global so we never repeat the same item text in one run

function startAdaptive() {
  currentDifficulty = 2;
  currentIndex = 0;
  score = 0;
  stars = 0;
  correctByLevel = {1: 0, 2: 0, 3: 0};
  askedByLevel = {1: 0, 2: 0, 3: 0};
  usedEasy = new Set();
  usedMedium = new Set();
  usedHard = new Set();
  sessionUsed = new Set();
  document.getElementById('home').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('practice').classList.remove('hidden');
  updateStars();
  showNextItem();
}

function getPool() {
  if (currentDifficulty === 1) return {items: easyItems, used: usedEasy};
  if (currentDifficulty === 3) return {items: hardItems, used: usedHard};
  return {items: mediumItems, used: usedMedium};
}

function updateStars() {
  document.getElementById('starDisplay').textContent = '⭐'.repeat(Math.min(stars, 5)) + '☆'.repeat(Math.max(0, 5 - stars));
}

function showNextItem() {
  if (currentIndex >= totalQuestions) {
    showResults();
    return;
  }
  document.getElementById('feedbackText').textContent = '';

  // Prefer current difficulty, but fall back if that pool is exhausted
  let attempts = 0;
  let pool;
  let available = [];
  while (available.length === 0 && attempts < 6) {
    pool = getPool();
    available = pool.items
      .map((item, i) => ({item, i}))
      .filter(x => !pool.used.has(x.i) && !sessionUsed.has(JSON.stringify(x.item)));
    if (available.length === 0) {
      // try a different difficulty
      currentDifficulty = ((currentDifficulty) % 3) + 1;
      attempts++;
    }
  }

  if (available.length === 0) {
    // absolute fallback: any unused
    available = [...easyItems, ...mediumItems, ...hardItems]
      .map((item, i) => ({item, i}))
      .filter(x => !sessionUsed.has(JSON.stringify(x.item)));
    if (available.length === 0) available = mediumItems.map((item, i) => ({item, i}));
  }

  const pick = available[Math.floor(Math.random() * available.length)];
  const item = pick.item;
  pool.used.add(pick.i);
  sessionUsed.add(JSON.stringify(item));

  askedByLevel[currentDifficulty]++;
  document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${totalQuestions}`;
  const labels = {1: "🌟 Easy Level", 2: "🚀 Grade 2 Level", 3: "🔥 Super Challenge"};
  document.getElementById('diffLabel').textContent = labels[currentDifficulty] || "🚀 Grade 2 Level";

  const area = document.getElementById('questionArea');
  let html = '';
  if (item.passage) html += `<div class="passage">${item.passage}</div>`;
  if (item.sentence) {
    html += `<div class="question">${item.sentence.replace('___', '<span class="blank">______</span>')}</div>`;
  } else {
    html += `<div class="question">${item.question}</div>`;
  }
  const letters = ['A', 'B', 'C', 'D'];
  html += '<div class="options">';
  item.options.forEach((opt, i) => {
    html += `<div class="option" onclick="selectAnswer(${i}, ${item.answer}, ${currentDifficulty})">
      <div class="letter">${letters[i]}</div><div>${opt}</div>
    </div>`;
  });
  html += '</div>';
  area.innerHTML = html;
}

function selectAnswer(chosen, correct, diffAtAnswer) {
  const options = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedbackText');
  options.forEach((opt, idx) => {
    opt.style.pointerEvents = 'none';
    if (idx === correct) opt.classList.add('correct');
    if (idx === chosen && chosen !== correct) opt.classList.add('wrong');
  });
  if (chosen === correct) {
    score++;
    stars = Math.min(stars + 1, 5);
    correctByLevel[diffAtAnswer]++;
    feedback.textContent = "Awesome! 🎉";
    feedback.style.color = "#4CAF50";
    if (currentDifficulty < 3) currentDifficulty++;
  } else {
    feedback.textContent = "Good try! Keep going 💪";
    feedback.style.color = "#FF6B6B";
    if (currentDifficulty > 1) currentDifficulty--;
  }
  updateStars();
  currentIndex++;
  setTimeout(showNextItem, 1100);
}

function showResults() {
  document.getElementById('practice').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  const percent = Math.round((score / totalQuestions) * 100);
  let summary = `You got <strong>${score}</strong> out of <strong>${totalQuestions}</strong>!<br>`;
  summary += `<span style="font-size:28px;">${percent >= 80 ? '🏆 Super Reader!' : percent >= 60 ? '⭐ Great Job!' : '🌟 Keep Going!'}</span><br><br>`;
  summary += `Easier: ${correctByLevel[1]}/${askedByLevel[1] || 0}<br>`;
  summary += `Grade 2: ${correctByLevel[2]}/${askedByLevel[2] || 0}<br>`;
  summary += `Challenge: ${correctByLevel[3]}/${askedByLevel[3] || 0}<br>`;
  document.getElementById('resultsText').innerHTML = summary;
  document.getElementById('resultMascot').textContent = percent >= 80 ? '🏆' : percent >= 60 ? '🎉' : '💪';
}

function showHome() {
  document.getElementById('practice').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}
</script>
</body>
</html>

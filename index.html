    padding: 12px;
  }
  .container { max-width: 820px; margin: 0 auto; }

  .subtitle { color: #4ECDC4; text-align: center; margin-bottom: 16px; font-size: 20px; font-weight: bold; }
  .card {
    background: white; border-radius: 24px; padding: 22px; margin-bottom: 16px;
    box-shadow: 0 8px 0 #FFD93D, 0 12px 25px rgba(0,0,0,0.15); border: 4px solid #FFD93D;
  }
  .start-btn {
    display: block; width: 100%; background: linear-gradient(135deg, #FF6B6B, #FF8E53);
    color: white; border: none; padding: 20px; font-size: 24px; border-radius: 20px;
    margin: 12px 0; cursor: pointer; font-weight: bold; box-shadow: 0 6px 0 #E55A5A;
  }
  .passage {
    background: #FFF9E6; border-left: 6px solid #FF6B6B; padding: 16px; margin: 16px 0;
    font-size: 22px; line-height: 1.6; border-radius: 12px; border: 3px solid #FFE5B4;
  }
  .question { font-size: 24px; font-weight: bold; margin: 18px 0 12px; }
  .option {
    display: flex; align-items: center; background: #F0F8FF; border: 3px solid #87CEEB;
    border-radius: 16px; padding: 16px 18px; margin: 12px 0; font-size: 20px; cursor: pointer;
  }
  .option.correct { background: #C8E6C9; border-color: #4CAF50; }
  .option.wrong { background: #FFCDD2; border-color: #F44336; }
  .letter {
    background: #4ECDC4; color: white; width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 14px; font-size: 22px;
  }
  .option.correct .letter { background: #4CAF50; }
  .option.wrong .letter { background: #F44336; }
  .btn { background: #4ECDC4; color: white; border: none; padding: 14px 24px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 8px; }
  .btn-secondary { background: #FF6B6B; }
  .controls { text-align: center; margin-top: 18px; }
  .score-box { text-align: center; font-size: 22px; margin: 16px 0; line-height: 1.6; }
  .hidden { display: none; }
  .progress { font-size: 18px; color: #FF6B6B; text-align: center; margin-bottom: 6px; font-weight: bold; }
  .stars { text-align: center; font-size: 28px; margin: 8px 0; }
  .feedback { text-align: center; font-size: 22px; font-weight: bold; margin: 10px 0; min-height: 30px; }
  .mascot { text-align: center; font-size: 48px; margin-bottom: 8px; }
  .progress-bar { background: #eee; border-radius: 10px; height: 18px; margin: 6px 0 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #4ECDC4, #4CAF50); border-radius: 10px; transition: width 0.4s; }
  .progress-row { margin: 12px 0; font-size: 18px; }
</style>

    <div class="feedback" id="feedbackText"></div>
    <div class="controls">

    </div>
  </div>

  <div id="results" class="card hidden">

    <div class="score-box" id="resultsText"></div>
    <div class="controls">

let history = JSON.parse(localStorage.getItem('readingHistory') || '{}');
let sessionHistory = JSON.parse(localStorage.getItem('sessionHistory') || '[]');
let currentIndex = 0;
let inPractice = true;
const totalQuestions = 34;
const practiceQuestions = 3;
let score = 0;
let stars = 0;
let sessionUsed = new Set();
let currentQuestion = null;
let missedQuestions = [];

function getWeakness(type) {
  const h = history[type] || { correct: 0, total: 0 };
  if (h.total < 2) return 0.6;
  return 1 - (h.correct / h.total);
}

function pickQuestion() {
  // Bias toward vocab and passages to better match FAST balance
  const types = ['vocab', 'vocab', 'passage', 'phonics', 'audio'];
  const weights = types.map(t => ({ type: t, w: getWeakness(t) + 0.3 }));
  const totalW = weights.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * totalW;
  let chosen = 'vocab';
  for (const w of weights) {
    r -= w.w;
    if (r <= 0) { chosen = w.type; break; }
  }

  let available = allQuestions.filter(q => q.type === chosen && !sessionUsed.has(q.id));
  if (available.length === 0) {
    available = allQuestions.filter(q => !sessionUsed.has(q.id));
  }
  if (available.length === 0) available = allQuestions;
  const q = available[Math.floor(Math.random() * available.length)];
  sessionUsed.add(q.id);
  return q;
}

function startAdaptive() {
  currentIndex = 0;
  score = 0;
  stars = 0;
  inPractice = true;
  missedQuestions = [];
  sessionUsed = new Set();
  document.getElementById('home').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('progressScreen').classList.add('hidden');
  document.getElementById('historyScreen').classList.add('hidden');
  document.getElementById('practice').classList.remove('hidden');
  updateStars();
  showNextItem();
}

function updateStars() {
  document.getElementById('starDisplay').textContent = '⭐'.repeat(Math.min(stars, 5)) + '☆'.repeat(Math.max(0, 5 - stars));
}

let englishVoice = null;
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  englishVoice = voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en'));
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  if (englishVoice) u.voice = englishVoice;
  speechSynthesis.speak(u);
}

function showNextItem() {
  const max = inPractice ? practiceQuestions : totalQuestions;
  if (currentIndex >= max) {
    if (inPractice) {
      inPractice = false;
      currentIndex = 0;
      sessionUsed = new Set();
      showNextItem();
      return;
    }
    showResults();
    return;
  }
  document.getElementById('feedbackText').textContent = '';
  try {
    currentQuestion = pickQuestion();
  } catch (e) {
    document.getElementById('questionArea').innerHTML = '<p style="color:red;">Error loading question. Please refresh.</p>';
    return;
  }
  const label = inPractice ? `Practice ${currentIndex + 1} of ${practiceQuestions}` : `Question ${currentIndex + 1} of ${totalQuestions}`;
  document.getElementById('progressText').textContent = label;

  const area = document.getElementById('questionArea');
  let html = '';
  if (currentQuestion.type === 'audio') {
    const safeText = (currentQuestion.audioText || '').replace(/'/g, "\\'").replace(/"/g, '"');
    html += `<button class="listen-btn" onclick="speak('${safeText}')">🔊 Listen</button>`;
    html += `<div class="question">${currentQuestion.question || ''}</div>`;
  } else if (currentQuestion.passage) {
    html += `<div class="passage">${currentQuestion.passage}</div>`;
    html += `<div class="question">${currentQuestion.question || ''}</div>`;
  } else if (currentQuestion.sentence) {
    html += `<div class="question">${currentQuestion.sentence.replace('___', '<span style="border-bottom:3px solid #FF6B6B;padding:0 8px;font-weight:bold;color:#FF6B6B;">______</span>')}</div>`;
  } else {
    html += `<div class="question">${currentQuestion.question || ''}</div>`;
  }
  const letters = ['A', 'B', 'C', 'D'];
  html += '<div class="options">';
  (currentQuestion.options || []).forEach((opt, i) => {
    html += `<div class="option" onclick="selectAnswer(${i})"><div class="letter">${letters[i]}</div><div>${opt}</div></div>`;
  });
  html += '</div>';
  area.innerHTML = html;
}

function selectAnswer(chosen) {
  const correct = currentQuestion.answer;
  const options = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedbackText');
  options.forEach((opt, idx) => {
    opt.style.pointerEvents = 'none';
    if (idx === correct) opt.classList.add('correct');
    if (idx === chosen && chosen !== correct) opt.classList.add('wrong');
  });

  const type = currentQuestion.type;
  if (!inPractice) {
    if (!history[type]) history[type] = { correct: 0, total: 0 };
    history[type].total++;
    if (chosen === correct) {
      score++;
      history[type].correct++;
    } else {
      missedQuestions.push({
        question: currentQuestion.question || currentQuestion.sentence || currentQuestion.passage,
        correctAnswer: currentQuestion.options[correct],
        type: type
      });
    }
    localStorage.setItem('readingHistory', JSON.stringify(history));
  }
  if (chosen === correct) {
    stars = Math.min(stars + 1, 5);
    feedback.textContent = "Awesome! 🎉";
    feedback.style.color = "#4CAF50";
  } else {
    feedback.textContent = "Good try! Keep going 💪";
    feedback.style.color = "#FF6B6B";
  }
  updateStars();
  currentIndex++;
  setTimeout(showNextItem, 1100);
}

function showResults() {
  document.getElementById('practice').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  const percent = Math.round((score / totalQuestions) * 100);
  sessionHistory.unshift({
    date: new Date().toLocaleString(),
    score: score,
    total: totalQuestions,
    percent: percent
  });
  if (sessionHistory.length > 50) sessionHistory = sessionHistory.slice(0, 50);
  localStorage.setItem('sessionHistory', JSON.stringify(sessionHistory));

  let summary = `You got <strong>${score}</strong> out of <strong>${totalQuestions}</strong>!<br>`;
  summary += `<span style="font-size:28px;">${percent >= 80 ? '🏆 Super Reader!' : percent >= 60 ? '⭐ Great Job!' : '🌟 Keep Going!'}</span><br><br>`;
  summary += "Progress saved.<br>";
  if (missedQuestions.length > 0) {
    summary += `<div style="margin-top:16px; text-align:left;"><strong>Review missed questions:</strong><br>`;
    missedQuestions.forEach((m, i) => {
      summary += `<div style="margin:8px 0; padding:8px; background:#FFF3CD; border-radius:8px; font-size:16px;">${i+1}. ${m.question || 'Question'}<br><em>Correct: ${m.correctAnswer}</em></div>`;
    });
    summary += `</div>`;
  }
  document.getElementById('resultsText').innerHTML = summary;
  document.getElementById('resultMascot').textContent = percent >= 80 ? '🏆' : percent >= 60 ? '🎉' : '💪';
}

function showHistory() {
  document.getElementById('home').classList.add('hidden');
  document.getElementById('historyScreen').classList.remove('hidden');
  if (sessionHistory.length === 0) {
    document.getElementById('historyContent').innerHTML = '<p style="text-align:center; font-size:18px;">No tests completed yet.</p>';
    return;
  }
  let html = '';
  sessionHistory.forEach((s, i) => {
    html += `<div style="padding:10px; border-bottom:1px solid #eee; font-size:18px;">
      <strong>${s.date}</strong><br>
      Score: ${s.score}/${s.total} (${s.percent}%)
    </div>`;
  });
  document.getElementById('historyContent').innerHTML = html;
}

function showProgress() {
  document.getElementById('home').classList.add('hidden');
  document.getElementById('progressScreen').classList.remove('hidden');
  const types = [
    { key: 'vocab', label: 'Vocabulary' },
    { key: 'phonics', label: 'Phonics' },
    { key: 'passage', label: 'Passages' },
    { key: 'audio', label: 'Listening' }
  ];
  let html = '';
  let totalCorrect = 0, totalAsked = 0;
  const weakAreas = [];
  types.forEach(t => {
    const h = history[t.key] || { correct: 0, total: 0 };
    totalCorrect += h.correct;
    totalAsked += h.total;
    const pct = h.total ? Math.round((h.correct / h.total) * 100) : 0;
    const missed = h.total - h.correct;
    html += `<div class="progress-row"><strong>${t.label}</strong>: ${h.correct}/${h.total} correct (${pct}%)</div>`;
    html += `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    if (h.total >= 3 && pct < 70) weakAreas.push(t.label + ' (' + missed + ' missed)');
  });
  const overall = totalAsked ? Math.round((totalCorrect / totalAsked) * 100) : 0;
  html = `<div style="text-align:center; font-size:22px; margin-bottom:18px;">Overall: <strong>${totalCorrect}/${totalAsked}</strong> (${overall}%)</div>` + html;
  if (weakAreas.length > 0) {
    html += `<div style="margin-top:20px; padding:12px; background:#FFF3CD; border-radius:12px; font-size:18px;"><strong>Needs more practice:</strong><br>${weakAreas.join('<br>')}</div>`;
  } else if (totalAsked > 0) {
    html += `<div style="margin-top:20px; padding:12px; background:#D4EDDA; border-radius:12px; font-size:18px; text-align:center;"><strong>Looking good!</strong><br>Keep practicing to stay strong.</div>`;
  }
  if (totalAsked === 0) html = '<p style="text-align:center; font-size:18px;">No practice yet. Start an adventure to see progress!</p>';
  document.getElementById('progressContent').innerHTML = html;
}

function showHome() {
  document.getElementById('practice').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('progressScreen').classList.add('hidden');
  document.getElementById('historyScreen').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}
